{% include "leases/_bars.html" %}
{% if lease_chips %}
<div class="erp-chips" role="navigation" aria-label="Quick filters">
  {% for chip in lease_chips %}
    <a class="erp-chip erp-chip-{{ chip.tone }}{% if chip.active %} is-active{% endif %}" href="{{ chip.url }}">{{ chip.label }} <b>{{ chip.count }}</b></a>
  {% endfor %}
</div>
{% endif %}
